# Ambiente de desenvolvimento. Todas as portas abrem só para o próprio Mac (127.0.0.1).
# Segredos vêm do arquivo .env na raiz (veja .env.example).

services:
  mongo:
    image: mongo:7
    # Replica set de um nó: libera transações e Change Streams, que um Mongo avulso não tem.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      # Inicia o replica set na primeira subida; depois só confere que está de pé.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 20

  # Armazenamento compatível com S3 (SeaweedFS). Em produção: Amazon S3 ou Cloudflare R2.
  s3:
    image: chrislusf/seaweedfs:latest
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?defina S3_ACCESS_KEY_ID no .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?defina S3_SECRET_ACCESS_KEY no .env}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/clipo
        printf '{"identities":[{"name":"clipo","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /etc/clipo/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/clipo/s3.json -master.volumeSizeLimitMB=1024 -volume.max=100
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3data:/data

  # Caixa de saída de e-mails de desenvolvimento: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"

  api:
    build: ./apps/api
    environment: &api-env
      ENVIRONMENT: development
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      COOKIE_SECURE: "false"
      MONGODB_URL: mongodb://mongo:27017/?replicaSet=rs0
      MONGODB_DB: clipo
      APP_BASE_URL: http://localhost:3200
      CORS_ORIGINS: '["http://localhost:3200"]'
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      S3_ENDPOINT_URL: http://s3:8333
      S3_PUBLIC_ENDPOINT_URL: http://localhost:8333
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?defina TOKEN_ENCRYPTION_KEY no .env}
      # Opcionais: sem eles, login social, IA, contas sociais e webhook respondem "não configurado".
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:7b}
      STT_PROVIDER: ${STT_PROVIDER:-local}
      STT_BASE_URL: ${STT_BASE_URL:-https://api.openai.com/v1}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-whisper-1}
      LOCAL_WHISPER_MODEL: ${LOCAL_WHISPER_MODEL:-base}
      WHISPER_MODELS_DIR: /models
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_ENVIRONMENT: ${ASAAS_ENVIRONMENT:-sandbox}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      TRIAL_PLAN_ID: ${TRIAL_PLAN_ID:-pro}
      TRIAL_DAYS: ${TRIAL_DAYS:-7}
      BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-5}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      # O worker chama a própria API (diagnóstico do webhook) pela rede interna.
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
      s3:
        condition: service_started
      mailpit:
        condition: service_started

  # Processa a fila de vídeos e cortes, e roda a manutenção (lixeira, envios abandonados, LGPD).
  # Mesma imagem da API; pode ter várias cópias: docker compose up -d --scale worker=3
  worker:
    build: ./apps/api
    command: ["python", "-m", "clipo_api.worker"]
    environment:
      <<: *api-env
      WORKER_CONCURRENCY: "2"
      WORKER_SCRATCH: /scratch
    volumes:
      - worker-scratch:/scratch
      # Modelo de transcrição local (baixado uma vez, ~150 MB no "base").
      - whisper-models:/models
    stop_grace_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
      s3:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        # O navegador fala só com o Next; o Next repassa /api/* para a API pela rede interna.
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3200:3000"
    depends_on:
      - api

volumes:
  mongodata:
  s3data:
  # Arquivos temporários do worker (vídeo baixado para cortar).
  worker-scratch:
  whisper-models:
